<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>改變中的海 — 互動闖關</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root{
    --deep:#0a3d62; --mid:#1e6091; --sea:#168aad; --aqua:#34c3eb;
    --sand:#e9d8a6; --rock:#b08968; --coral:#ff7b54; --green:#52b788;
    --ink:#0b2545; --card:#ffffff;
  }
  body{
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#9be7ff 0%,#34c3eb 35%,#168aad 70%,#0a3d62 100%);
    min-height:100vh; overflow-x:hidden;
  }
  .waves{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.25;}
  .bubble{position:fixed;bottom:-40px;border-radius:50%;background:rgba(255,255,255,.4);
    animation:rise linear infinite;pointer-events:none;z-index:0;}
  @keyframes rise{to{transform:translateY(-110vh);opacity:0;}}
  .wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:16px 14px 60px;}
  header{text-align:center;color:#fff;padding:18px 10px 8px;}
  header h1{font-size:30px;text-shadow:0 2px 8px rgba(0,0,0,.3);letter-spacing:1px;}
  header p{font-size:15px;opacity:.95;margin-top:6px;}
  .progress{display:flex;gap:5px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
  .dot{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;
    border:2px solid rgba(255,255,255,.6);font-size:13px;transition:.3s;}
  .dot.active{background:#fff;color:var(--mid);transform:scale(1.12);box-shadow:0 4px 12px rgba(0,0,0,.25);}
  .dot.done{background:var(--green);border-color:#fff;}
  .scorebar{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 2px;position:relative;}
  #scoreBadge{background:rgba(255,255,255,.92);color:var(--ink);font-size:14px;font-weight:bold;
    padding:6px 16px;border-radius:20px;box-shadow:0 3px 10px rgba(0,0,0,.2);}
  #scoreBadge b{color:var(--coral);font-size:16px;}
  .scoreflash{position:absolute;right:14px;top:-2px;font-weight:bold;font-size:18px;opacity:0;
    transition:opacity .25s;pointer-events:none;}
  .scoreflash.up{color:#caffbf;text-shadow:0 1px 4px rgba(0,0,0,.4);}
  .scoreflash.down{color:#ffadad;text-shadow:0 1px 4px rgba(0,0,0,.4);}
  .card{background:var(--card);border-radius:22px;padding:22px 20px;margin-top:8px;
    box-shadow:0 12px 34px rgba(0,0,0,.25);animation:pop .4s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;}}
  .card h2{font-size:22px;color:var(--mid);margin-bottom:4px;}
  .card .sub{color:#5a6b7b;font-size:14px;margin-bottom:14px;line-height:1.6;}
  .scene-tag{display:inline-block;background:var(--aqua);color:#fff;font-size:13px;
    padding:3px 12px;border-radius:20px;margin-bottom:10px;font-weight:bold;}
  .btn{display:inline-block;background:var(--coral);color:#fff;border:none;cursor:pointer;
    font-size:17px;font-weight:bold;padding:13px 26px;border-radius:30px;margin-top:10px;
    box-shadow:0 6px 0 #d85f3c;transition:.1s;font-family:inherit;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d85f3c;}
  .btn.blue{background:var(--sea);box-shadow:0 6px 0 #0f5e7a;}
  .btn.blue:active{box-shadow:0 2px 0 #0f5e7a;}
  .btn.ghost{background:#eef3f6;color:var(--mid);box-shadow:0 6px 0 #cdd9e0;}
  .btn.ghost:active{box-shadow:0 2px 0 #cdd9e0;}
  .btn:disabled{background:#b9c4cc;box-shadow:0 6px 0 #95a3ab;cursor:not-allowed;transform:none;}
  .center{text-align:center;}
  .login-box{max-width:380px;margin:20px auto;text-align:center;}
  .login-box .logo{font-size:60px;display:block;margin-bottom:10px;}
  .login-box h2{font-size:22px;color:var(--mid);margin-bottom:16px;}
  .login-field{text-align:left;margin-bottom:12px;}
  .login-field label{display:block;font-size:14px;font-weight:bold;color:#5a6b7b;margin-bottom:4px;}
  .login-field input{width:100%;padding:12px 14px;border:2px solid #cdd9e0;border-radius:12px;
    font-size:16px;font-family:inherit;transition:.2s;}
  .login-field input:focus{outline:none;border-color:var(--sea);}
  .login-err{color:var(--coral);font-size:13px;margin-top:4px;display:none;}
  .reading-card{background:linear-gradient(135deg,#eaf6fb,#f5fbff);border:2px solid #b9def0;
    border-radius:16px;padding:18px;margin:10px 0;line-height:1.9;font-size:15px;}
  .reading-card h3{color:var(--mid);font-size:17px;margin-bottom:12px;}
  .hl{background:#fff3cd;padding:1px 4px;border-radius:4px;font-weight:bold;}
  .towers{display:flex;gap:14px;justify-content:center;margin:6px 0 4px;}
  .tower{flex:1;max-width:300px;text-align:center;}
  .tower.onecol{max-width:340px;margin:0 auto;}
  .tower h3{font-size:16px;margin-bottom:8px;}
  .stack{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;
    min-height:230px;justify-content:flex-end;}
  .block{width:90%;height:26px;border-radius:6px;cursor:pointer;color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;font-weight:bold;
    transition:.25s;box-shadow:inset 0 -3px rgba(0,0,0,.18);}
  .block:hover{filter:brightness(1.1);}
  .block.rock{background:linear-gradient(#caa472,#a9774b);}
  .block.ocean{background:linear-gradient(#3bc4e0,#1a86a8);}
  .block.gone{height:0;opacity:0;margin:0;padding:0;pointer-events:none;}
  .crown{font-size:34px;height:42px;transition:.3s;}
  .neck{font-size:13px;color:#7a5c3a;}
  .meter{font-size:13px;margin-top:8px;color:#33586e;min-height:20px;font-weight:bold;}
  .cardq{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.12);}
  .choose{display:flex;gap:10px;margin-top:10px;}
  .choose button{flex:1;font-family:inherit;cursor:pointer;border:none;border-radius:12px;
    padding:12px;font-size:15px;font-weight:bold;color:#fff;}
  .choose .nb{background:var(--rock);}
  .choose .hb{background:var(--sea);}
  .fb{margin-top:10px;font-weight:bold;min-height:24px;font-size:15px;}
  .fb.ok{color:var(--green);} .fb.no{color:var(--coral);}
  .cycle{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;}
  .pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;}
  .chip{background:#fff;border:2px solid var(--sea);color:var(--mid);border-radius:20px;
    padding:10px 16px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;}
  .chip:disabled{opacity:.35;cursor:default;}
  .slot{background:#eaf6fb;border:2px dashed #9cc;border-radius:14px;padding:10px 14px;
    font-size:15px;min-width:120px;text-align:center;font-weight:bold;color:var(--mid);}
  .slot.filled{background:var(--green);color:#fff;border-style:solid;border-color:var(--green);}
  .arrow{font-size:20px;color:#fff;align-self:center;}
  .match{display:flex;gap:10px;margin-top:14px;}
  .mcol{flex:1;display:flex;flex-direction:column;gap:8px;}
  .lfbtn{font-family:inherit;cursor:pointer;border:2px solid #cdd9e0;background:#fff;color:var(--ink);
    border-radius:12px;padding:12px 10px;font-size:14px;font-weight:bold;line-height:1.4;transition:.15s;text-align:left;}
  #mleft .lfbtn{text-align:center;font-size:16px;}
  .lfbtn:hover:not(.right){border-color:var(--sea);}
  .lfbtn.sel{border-color:var(--coral);background:#fff1ec;}
  .lfbtn.right{background:var(--green);color:#fff;border-color:var(--green);cursor:default;}
  .lfbtn.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .coralbox{text-align:center;background:linear-gradient(180deg,#cdeffd,#7fd4f0);border-radius:16px;
    padding:18px;margin:8px 0;}
  .coral{font-size:78px;transition:filter .4s;line-height:1.1;}
  .coralstat{font-size:15px;font-weight:bold;color:#1a5870;margin-top:6px;min-height:22px;}
  .tempslider{width:100%;margin-top:14px;accent-color:var(--coral);height:8px;}
  .templabel{display:flex;justify-content:space-between;font-size:13px;color:#5a6b7b;margin-top:6px;}
  .tempnow{font-weight:bold;color:var(--coral);font-size:16px;}
  .flip-timer{font-size:18px;font-weight:bold;text-align:center;color:var(--mid);margin:8px 0;min-height:28px;}
  .flip-timer.warn{color:var(--coral);}
  .flip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0;}
  @media(max-width:480px){.flip-grid{grid-template-columns:repeat(3,1fr);}}
  .flipcard{height:80px;cursor:pointer;perspective:600px;}
  .flipinner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .4s;}
  .flipcard.flipped .flipinner,.flipcard.matched .flipinner{transform:rotateY(180deg);}
  .flipfront,.flipback{position:absolute;width:100%;height:100%;backface-visibility:hidden;
    border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;
    font-size:13px;text-align:center;padding:6px;line-height:1.3;}
  .flipfront{background:linear-gradient(135deg,#168aad,#0a3d62);color:#fff;font-size:24px;}
  .flipback{background:#eaf6fb;border:2px solid var(--sea);color:var(--ink);transform:rotateY(180deg);}
  .flipcard.matched .flipback{background:var(--green);border-color:var(--green);color:#fff;}
  .qopt{flex:1 1 45%;min-width:120px;font-family:inherit;cursor:pointer;border:2px solid #cdd9e0;
    background:#fff;color:var(--ink);border-radius:12px;padding:11px 8px;font-size:14px;font-weight:bold;transition:.15s;}
  .qopt:hover:not(:disabled){border-color:var(--sea);}
  .qopt:disabled{cursor:default;opacity:.7;}
  .qopt.right{background:var(--green);color:#fff;border-color:var(--green);opacity:1;}
  .qopt.wrong{background:#ffe0d6;border-color:var(--coral);color:var(--coral);}
  .vqq{font-size:15px;font-weight:bold;color:var(--ink);margin-bottom:8px;line-height:1.5;}
  .check{display:flex;align-items:center;gap:10px;background:#f1f6f9;border-radius:12px;
    padding:12px;margin:8px 0;cursor:pointer;font-size:15px;}
  .check input{width:22px;height:22px;accent-color:var(--green);}
  textarea{width:100%;border:2px solid #cdd9e0;border-radius:12px;padding:12px;font-size:16px;
    font-family:inherit;margin-top:8px;resize:vertical;min-height:70px;}
  .pledge{background:linear-gradient(135deg,#168aad,#0a3d62);color:#fff;border-radius:18px;
    padding:22px;margin-top:14px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.3);}
  .pledge h3{font-size:18px;margin-bottom:10px;}
  .pledge .big{font-size:19px;line-height:1.7;margin:10px 0;}
  .star{font-size:40px;}
  .scorecard{background:linear-gradient(135deg,#168aad,#0a3d62);color:#fff;border-radius:16px;
    padding:16px;margin:6px 0 14px;box-shadow:0 8px 22px rgba(0,0,0,.25);}
  .bignum{font-size:46px;font-weight:bold;line-height:1.1;}
  .bignum span{font-size:20px;font-weight:normal;}
  .qa{font-size:15px;margin-top:4px;font-weight:bold;color:#dff3fb;}
  .note2{font-size:14px;margin-top:8px;color:#ffe7a8;}
  .final{text-align:center;color:var(--ink);padding:10px 0;}
  .badge{font-size:90px;animation:spin 3s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hide{display:none;}
  .note{font-size:12px;color:#7a8a96;margin-top:14px;text-align:center;}
  .lb-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;}
  .lb-table th{background:var(--mid);color:#fff;padding:8px;text-align:center;}
  .lb-table td{padding:8px;text-align:center;border-bottom:1px solid #e0eef5;}
  .lb-table tr.me td{background:#ffe7a8;font-weight:bold;}
  .advice{background:linear-gradient(135deg,#e8f8f0,#d4f0e8);border:2px solid var(--green);
    border-radius:14px;padding:14px;margin:10px 0;font-size:14px;line-height:1.6;}
  .advice h4{color:#2d7a55;margin-bottom:6px;font-size:15px;}
</style>
</head>
<body>
<div class="waves"></div>
<div class="wrap">
  <header>
    <h1>🌊 改變中的海</h1>
    <p>大自然的雕刻 × 人類的足跡 — 互動闖關</p>
  </header>
  <div class="progress" id="progress"></div>
  <div class="scorebar">
    <span id="scoreBadge">⭐ 分數 <b>0</b> ｜ ✅ 0 ｜ ❌ 0</span>
    <span id="scoreFlash" class="scoreflash"></span>
  </div>
  <div id="stage"></div>
  <div class="note">海山國小 · 永續發展教案 · 連結「野柳女王頭」與「浮潛海洋生態」</div>
</div>
<script>
const LS_KEY='seaGame_v2';
const PT_OK=10,PT_NO=5,STEPS=10;
const PAIR_COLORS=["#2d8a5f","#1e6091","#e07a3c","#7b4fb5"];
const sortCards=[
  {t:"野柳女王頭的脖子被海風海浪磨得越來越細",a:"nat"},
  {t:"海裡的珊瑚因為海水變熱而白化死亡",a:"hum"},
  {t:"蕈狀岩經過兩千萬年慢慢被侵蝕成形",a:"nat"},
  {t:"寶特瓶和塑膠袋漂在海面上，海龜誤食",a:"hum"},
  {t:"豆腐岩沿著天然裂縫被海水切割成方塊",a:"nat"},
  {t:"漁船過度捕撈，海裡的魚越來越少",a:"hum"},
  {t:"寄居蟹找不到貝殼，只好拿塑膠垃圾當家",a:"hum"},
  {t:"海浪帶著小石頭在岩石上打轉，磨出一個個壺穴",a:"nat"},
];
const cycleAnswer=["🐠 海裡的生命","⬇️ 死亡後沉到海底","🪨 沉積變成岩石","🌊 被海水侵蝕風化","🐠 養分回到海洋"];
const cyclePool=["🪨 沉積變成岩石","🐠 海裡的生命","🌊 被海水侵蝕風化","🐠 養分回到海洋","⬇️ 死亡後沉到海底"];
const landforms=[
  {name:"👑 女王頭",cause:"砂岩被風化和海水侵蝕，脖子越變越細"},
  {name:"🧈 豆腐岩",cause:"沿著岩石的天然裂縫，被切割成一塊塊方格"},
  {name:"🕯️ 燭台石",cause:"中間有顆硬球，周圍被海水侵蝕成燭台形狀"},
  {name:"🕳️ 壺穴",cause:"海浪夾帶小石頭打轉，在岩石上磨出圓洞"},
];
const flipPairs=[
  ['珊瑚白化','海水升溫'],
  ['女王頭變細','長期風化侵蝕'],
  ['微塑膠','混入食物鏈'],
  ['壺穴形成','海浪夾石旋磨'],
  ['洋流','傳播海洋垃圾'],
  ['過度捕撈','魚類數量減少'],
];
const readQuizData=[
  {q:"野柳女王頭的脖子越來越細，最主要原因是什麼？",
   opts:["地震讓岩石斷裂","長期受風化與海水侵蝕","人類過度觸碰","海水污染"],
   a:1,cat:"geology",exp:"女王頭是砂岩，長期受風吹、海浪拍打侵蝕，脖子才越來越細。"},
  {q:"珊瑚白化最主要的原因是？",
   opts:["海水太乾淨","海水污染太嚴重","海水溫度上升（暖化）","海浪太大"],
   a:2,cat:"climate",exp:"海水溫度升高時，珊瑚把體內共生藻趕走，失去顏色，就是「白化」。"},
  {q:"「微塑膠」是指什麼？",
   opts:["一種塑膠袋品牌","小到肉眼幾乎看不見的塑膠碎片","可回收的環保塑膠","藍色的塑膠垃圾"],
   a:1,cat:"pollution",exp:"微塑膠是極細小的塑膠顆粒，會透過食物鏈進入魚類及人體內。"},
  {q:"壺穴是如何形成的？",
   opts:["火山噴發留下的洞","海浪夾帶石頭旋轉磨出圓洞","岩石天然裂縫被水沖開","人工開鑿"],
   a:1,cat:"geology",exp:"海浪帶著小石頭在低窪處打轉，長年磨蝕形成圓形的「壺穴」。"},
  {q:"相比人類對海洋的破壞，大自然對岩石的改變速度是？",
   opts:["一樣快","比人類破壞快","比人類破壞慢很多（千萬年）","只看颱風而定"],
   a:2,cat:"geology",exp:"自然地質變化需要百萬、千萬年；人類對海洋的破壞卻僅需幾十年。"},
];
const newsQuizData=[
  {q:"以下事件，哪一個發生得最早？",
   opts:["全球第四次珊瑚礁大白化（2024）","東加海底火山爆發（2022）","聯合國通過《公海條約》（2023）","南極海冰面積創新低（2025）"],
   a:1,cat:"geology",exp:"東加火山爆發於2022年，是這份大事紀中最早發生的事件。"},
  {q:"微塑膠進入人類血液，最主要是透過什麼途徑？",
   opts:["直接喝海水","吃了含有微塑膠的海鮮，透過食物鏈累積","在海邊游泳被皮膚吸收","塑膠袋分解成氣體吸入"],
   a:1,cat:"pollution",exp:"微塑膠透過「食物鏈累積」：魚類吃入後，人類再吃魚，微塑膠就進入人體。"},
  {q:"「海洋熱浪」和「珊瑚大白化」最主要的關係是？",
   opts:["完全沒有關係","海洋熱浪讓海水升溫，直接導致珊瑚白化","珊瑚白化後才出現海洋熱浪","只有颱風才讓珊瑚白化"],
   a:1,cat:"climate",exp:"海洋熱浪造成海水溫度異常升高，正是珊瑚白化的主要原因。"},
  {q:"《公海條約》通過後，個人最能做什麼來支持它的目標？",
   opts:["什麼都不用做，這是政府的事","減少塑膠使用、支持永續消費、傳播海洋保育觀念","只有科學家才能保護海洋","多搭飛機去看珊瑚礁"],
   a:1,cat:"conservation",exp:"個人的日常行動（減塑、永續消費）直接影響海洋健康，是支持《公海條約》精神的最佳方式。"},
  {q:"南極海冰消融，為什麼會讓全球海平面上升？",
   opts:["海冰融化增加海洋水量，造成海平面上升","海冰融化讓海水變冷，海平面反而下降","海冰和海平面完全無關","只有北極冰融化才影響海平面"],
   a:0,cat:"climate",exp:"陸地冰川（南極冰蓋）融化後，水流入海洋，才會使全球海平面上升。"},
];

let state={playerName:'',step:0,points:0,correct:0,wrong:0,sortIdx:0,cycleNext:0,
  wrongCats:{pollution:0,climate:0,conservation:0,geology:0}};

function gain(cat=''){state.points+=PT_OK;state.correct++;flashScore('+'+PT_OK,true);updateScore();}
function lose(cat=''){state.points=Math.max(0,state.points-PT_NO);state.wrong++;
  if(cat)state.wrongCats[cat]=(state.wrongCats[cat]||0)+1;flashScore('-'+PT_NO,false);updateScore();}

function flashScore(t,ok){const e=document.getElementById('scoreFlash');if(!e)return;
  e.textContent=t;e.className='scoreflash '+(ok?'up':'down');e.style.opacity='1';

    html+=`<div style="margin-bottom:20px"><div class="vqq">${qi+1}. ${q.q}</div>

function ansRQ(qi,oi){if(rqDone.has(qi))return;
  const q=readQuizData[qi],fb=document.getElementById('rqfb'+qi),chosen=document.getElementById('rq'+qi+'o'+oi);
  if(oi===q.a){rqDone.add(qi);chosen.classList.add('right');gain(q.cat);
    q.opts.forEach((_,i)=>document.getElementById('rq'+qi+'o'+i).disabled=true);
    fb.className='fb ok';fb.innerHTML=`✅ 答對！(+10) <span style="font-weight:normal;font-size:13px">💡 ${q.exp}</span>`;
  }else{chosen.classList.add('wrong');chosen.disabled=true;lose(q.cat);fb.className='fb no';fb.textContent='❌ 再想想！(-5)';}
  if(rqDone.size===readQuizData.length)document.getElementById('rqNext').classList.remove('hide');}

    <div class="flip-timer" id="flipTimer">⏱ 剩餘時間：02:00</div>
    <div class="flip-grid">${grid}</div><div class="fb" id="flipFb"></div>
    <div class="center hide" id="flipNext"><button class="btn" onclick="goto(8)">下一關：深度思考 →</button></div>`);
  flipTimer=setInterval(flipTick,1000);}
function flipTick(){flipTimeLeft--;const el=document.getElementById('flipTimer');
  if(!el){clearInterval(flipTimer);return;}
  const m=Math.floor(flipTimeLeft/60),s=flipTimeLeft%60;
  el.textContent=`⏱ 剩餘時間：${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(flipTimeLeft<=10)el.classList.add('warn');
  if(flipTimeLeft<=0){clearInterval(flipTimer);el.textContent='⏱ 時間到！';
    const fb=document.getElementById('flipFb');
    if(fb){fb.className='fb no';fb.textContent='⏰ 時間到！繼續下一關。';}
    document.getElementById('flipNext')?.classList.remove('hide');
    document.querySelectorAll('.flipcard:not(.matched)').forEach(c=>c.style.pointerEvents='none');}}
function flipClick(ci){if(flipLocked)return;
  const card=document.getElementById('fc'+ci);
  if(card.classList.contains('matched')||card.classList.contains('flipped')||flipFirst===ci)return;
  card.classList.add('flipped');
  if(flipFirst===null){flipFirst=ci;return;}
  const c1=document.getElementById('fc'+flipFirst);
  const pi1=+c1.dataset.pi,side1=+c1.dataset.side,pi2=+card.dataset.pi,side2=+card.dataset.side;
  if(pi1===pi2&&side1!==side2){c1.classList.add('matched');card.classList.add('matched');
    flipMatched.add(pi1);flipFirst=null;gain();
    const fb=document.getElementById('flipFb');fb.className='fb ok';fb.textContent='✅ 配對成功！(+10)';
    if(flipMatched.size===flipPairs.length){clearInterval(flipTimer);
      document.getElementById('flipTimer').textContent='🎉 全部配對完成！';
      fb.innerHTML='🎉 太棒了，全部配對完成！';
      document.getElementById('flipNext').classList.remove('hide');}
  }else{flipLocked=true;lose();
    const fb=document.getElementById('flipFb');fb.className='fb no';fb.textContent='❌ 不是一對，翻回去！(-5)';
    setTimeout(()=>{c1.classList.remove('flipped');card.classList.remove('flipped');flipFirst=null;flipLocked=false;},1000);}}

let nqDone=new Set();
function lvlNewsQuiz(){nqDone=new Set();let html='';
  newsQuizData.forEach((q,qi)=>{let opts='';
    q.opts.forEach((o,oi)=>{opts+=`<button class="qopt" id="nq${qi}o${oi}" onclick="ansNQ(${qi},${oi})">${o}</button>`;});
    html+=`<div style="margin-bottom:22px"><div class="vqq">${qi+1}. ${q.q}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">${opts}</div>
      <div class="fb" id="nqfb${qi}"></div></div>`;});
  show(`<span class="scene-tag">關卡 9 / 10 · 深度思考</span><h2>🧠 海洋大事深度題</h2>
    <p class="sub">不只考記憶——要<b>分析</b>和<b>應用</b>你學到的知識！答對 +10，答錯 -5。</p>
    ${html}
    <div class="center hide" id="nqNext"><button class="btn" onclick="goto(9)">進入最後一關 🌱 →</button></div>`);}
function ansNQ(qi,oi){if(nqDone.has(qi))return;
  const q=newsQuizData[qi],fb=document.getElementById('nqfb'+qi),chosen=document.getElementById('nq'+qi+'o'+oi);
  if(oi===q.a){nqDone.add(qi);chosen.classList.add('right');gain(q.cat);
    q.opts.forEach((_,i)=>document.getElementById('nq'+qi+'o'+i).disabled=true);
    fb.className='fb ok';fb.innerHTML=`✅ 答對！(+10) <span style="font-weight:normal;font-size:13px">💡 ${q.exp}</span>`;
  }else{chosen.classList.add('wrong');chosen.disabled=true;lose(q.cat);fb.className='fb no';fb.textContent='❌ 再想想！(-5)';}
  if(nqDone.size===newsQuizData.length)document.getElementById('nqNext').classList.remove('hide');}

function lvl4(){
  const acts=["🛒 買東西自備購物袋、不買過度包裝","🥤 自備水壺，少用一次性塑膠",
    "🗑️ 看到海邊垃圾主動撿起、做好分類","🐟 認識永續海鮮，吃對魚","📣 把今天學到的告訴家人朋友"];
  let list='';acts.forEach((a,i)=>{list+=`<label class="check"><input type="checkbox" onchange="updPledge()" id="act${i}"><span>${a}</span></label>`;});
  show(`<span class="scene-tag">關卡 10 / 10 · 最終關</span><h2>🌱 我是改變的力量</h2>
    <p class="sub">有些改變只能珍惜；有些改變我們<b>可以阻止</b>。<br>勾選行動，寫下你的永續宣言！</p>
    ${list}
    <textarea id="vow" placeholder="✍️ 寫下我的永續宣言：我承諾……" oninput="updPledge()"></textarea>
    <div id="pledgeBox"></div>
    <div class="center">
      <button class="btn" id="finishBtn" disabled onclick="finish()">完成闖關，看我的成績 🏅</button>
      <div class="fb" id="vowHint" style="font-size:14px;color:#c0612e">✍️ 先勾一個行動、並寫下你的永續宣言，才能完成闖關喔！</div>
    </div>`);}
function updPledge(){let n=0;for(let i=0;i<5;i++)if(document.getElementById('act'+i)?.checked)n++;
  const vow=document.getElementById('vow').value.trim(),box=document.getElementById('pledgeBox');
  if(n>0||vow)box.innerHTML=`<div class="pledge"><div class="star">⭐</div><h3>我的永續宣言卡</h3>
    <div class="big">我選擇了 <b>${n}</b> 個護海行動${vow?'<br>「'+vow+'」':''}</div>
    <div class="sub" style="color:#cdeefb">分辨能改變的，並為它行動 — 這就是永續！</div></div>`;
  else box.innerHTML='';
  const btn=document.getElementById('finishBtn'),hint=document.getElementById('vowHint');
  if(btn){const ok=(n>0&&vow.length>0);btn.disabled=!ok;if(hint)hint.classList.toggle('hide',ok);}}

function saveScore(){const entry={name:state.playerName,pts:state.points,correct:state.correct,wrong:state.wrong,ts:Date.now()};
  try{const all=JSON.parse(localStorage.getItem(LS_KEY)||'[]');all.push(entry);all.sort((a,b)=>b.pts-a.pts);
    localStorage.setItem(LS_KEY,JSON.stringify(all.slice(0,50)));}catch(e){}}
// 老師專用：在瀏覽器 Console 輸入 clearLb() 即可清除排行榜
function clearLb(){try{localStorage.removeItem(LS_KEY);alert('排行榜已清除');}catch(e){}}
function getAdvice(){const cats=state.wrongCats;
  const max=Math.max(cats.pollution,cats.climate,cats.conservation,cats.geology);
  if(max===0)return '你對所有主題都掌握得很好！繼續支持海洋保育！🎉';
  if(cats.pollution>=max)return '建議多了解<b>海洋污染</b>：微塑膠如何進入食物鏈，以及個人如何減塑行動。';
  if(cats.climate>=max)return '建議多關注<b>氣候變遷</b>對海洋的影響：珊瑚白化與海洋熱浪的成因。';
  if(cats.conservation>=max)return '建議多研究<b>海洋保育行動</b>：《公海條約》的意義與日常中可做的事。';
  return '建議多欣賞<b>地質地景</b>的奧妙：野柳各種地形的形成原因。';}
function renderLb(all){if(!all||!all.length)return '<p class="sub" style="text-align:center;margin-top:10px">還沒有其他紀錄</p>';
  let rows=all.slice(0,10).map((e,i)=>{const isMe=(e.name===state.playerName&&e.ts&&(Date.now()-e.ts)<8000);
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    return `<tr${isMe?' class="me"':''}><td>${medal||i+1}</td><td>${e.name}</td><td>${e.pts}</td><td>${e.correct}✅ ${e.wrong}❌</td></tr>`;}).join('');
  return `<table class="lb-table"><thead><tr><th>名次</th><th>姓名</th><th>分數</th><th>作答</th></tr></thead><tbody>${rows}</tbody></table>`;}
function finish(){if(flipTimer)clearInterval(flipTimer);
  state.points+=10;updateScore();renderProgress();
  document.querySelectorAll('#progress .dot').forEach(d=>d.classList.add('done'));
  saveScore();let all=[];try{all=JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){}
  const pts=state.points;let badge,title,note;
  if(pts>=280){badge='🏆';title='海洋守護者大師！';note='幾乎全對，你超級厲害！';}
  else if(pts>=210){badge='🥇';title='海洋守護者高手！';note='表現很棒，再挑戰看看能不能拿大師！';}
  else if(pts>=140){badge='🥈';title='見習海洋守護者';note='不錯！再玩一次，挑戰更高分。';}
  else{badge='🌱';title='努力中的小海星';note='別灰心，再看一次說明就會更厲害！';}
  stageEl().innerHTML=`<div class="card final">
    <div class="badge">${badge}</div><h2 style="color:var(--mid)">${title}</h2>
    <div class="scorecard"><div class="bignum">${pts}<span> 分</span></div>
      <div class="qa">✅ 答對 ${state.correct} 題　｜　❌ 答錯 ${state.wrong} 題</div>
      <div class="note2">${note}</div></div>
    <div class="advice"><h4>🌊 給 ${state.playerName} 的護海建議</h4><p>${getAdvice()}</p></div>
    <h3 style="color:var(--mid);margin:14px 0 6px">🏆 全班排行榜</h3>${renderLb(all)}
    <p class="sub" style="margin-top:14px">你學會了——<br>
    🪨 大自然的改變：慢、不可逆，我們珍惜<br>
    🐠 人類的改變：快、可逆，我們<b>能行動</b><br>
    🔄 海與岩是同一個地球的循環<br>
    🌱 永續，就是分辨清楚並付出行動</p>
    <div class="center">
      <button class="btn" onclick="window.print()">🖨️ 列印 / 存成 PDF</button>
      <button class="btn ghost" onclick="replayGame()">🔁 再玩一次</button>
    </div></div>`;}
function replayGame(){if(flipTimer)clearInterval(flipTimer);
  state={playerName:'',step:0,points:0,correct:0,wrong:0,sortIdx:0,cycleNext:0,
    wrongCats:{pollution:0,climate:0,conservation:0,geology:0}};
  renderProgress();updateScore();loginScreen();window.scrollTo({top:0,behavior:'smooth'});}

const stages=[lvlReadQuiz,lvlOceanTower,lvlCoral,lvlRockTower,lvlLandform,lvl2,lvl3,lvlFlipCard,lvlNewsQuiz,lvl4];
function goto(step){if(flipTimer&&step!==7)clearInterval(flipTimer);
  state.step=step;renderProgress();stages[step]();window.scrollTo({top:0,behavior:'smooth'});}

function makeBubbles(){for(let i=0;i<14;i++){const b=document.createElement('div');b.className='bubble';
  const s=6+Math.random()*22;b.style.width=s+'px';b.style.height=s+'px';
  b.style.left=Math.random()*100+'vw';b.style.animationDuration=(8+Math.random()*10)+'s';
  b.style.animationDelay=(Math.random()*8)+'s';document.body.appendChild(b);}}

renderProgress();updateScore();loginScreen();makeBubbles();
</script>
</body>
</html>
