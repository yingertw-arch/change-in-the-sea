  .qa{font-size:15px;margin-top:4px;font-weight:bold;color:#dff3fb;}
  .note2{font-size:14px;margin-top:8px;color:#ffe7a8;}
  .final{text-align:center;color:#fff;padding:30px 10px;}
  .badge{font-size:90px;animation:spin 3s linear infinite;display:inline-block;}

  .hide{display:none;}
  .note{font-size:12px;color:#7a8a96;margin-top:14px;text-align:center;}
  .vplayer{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;

function selRight(oi){
  const fb=document.getElementById('lffb');const cz=document.getElementById('cz'+oi);if(cz.classList.contains('right'))return;
  if(lfSel===null){fb.className='fb no';fb.textContent='👈 先點左邊的地景，再點原因喔！';return;}
  if(oi===lfSel){
    const col=PAIR_COLORS[lfMatched%PAIR_COLORS.length];const lb=document.getElementById('lf'+lfSel);
    [lb,cz].forEach(el=>{el.classList.add('right');el.classList.remove('sel');el.style.background=col;el.style.borderColor=col;el.style.color='#fff';});
    lfMatched++;lfSel=null;gain();fb.className='fb ok';fb.textContent='✅ 配對成功！(+10)';
    if(lfMatched===landforms.length)fb.innerHTML='🎉 全部配對完成！這些奇岩都是<b>風化與海水侵蝕</b>慢慢雕出來的。<div class="center"><button class="btn blue" onclick="goto(5)">下一關 →</button></div>';
  }else{cz.classList.add('shake');setTimeout(()=>cz.classList.remove('shake'),400);lose('geology');fb.className='fb no';fb.textContent='❌ 不是這個原因，扣 5 分，再想想～';}
}
function lvl2(){state.sortIdx=0;renderSort();}
function renderSort(){
  if(state.sortIdx>=sortCards.length){show(`<span class="scene-tag">關卡 6 / 10 · 統整</span><h2>🎯 分類高手！</h2><p class="sub">看完兩支影片、玩過兩座塔，你已經能分辨：<br>🪨 <b>自然的改變</b>＝慢、不可逆，我們珍惜它<br>🐠 <b>人為的改變</b>＝快、可逆，我們<b>能改變它</b>！</p><div class="center"><button class="btn blue" onclick="goto(6)">下一關 →</button></div>`);return;}
  const c=sortCards[state.sortIdx];
  show(`<span class="scene-tag">關卡 6 / 10 · 統整 · 第 ${state.sortIdx+1}/${sortCards.length} 題</span><h2>🗂️ 這是哪一種改變？</h2><p class="sub">讀一讀，判斷它是「自然的改變」還是「人為的改變」。</p><div class="cardq">${c.t}</div><div class="choose"><button class="nb" onclick="answerSort('nat')">🪨 自然的改變<br><small>慢 · 不可逆</small></button><button class="hb" onclick="answerSort('hum')">🐠 人為的改變<br><small>快 · 可阻止</small></button></div><div class="fb" id="sfb"></div>`);
}
function answerSort(a){
  const c=sortCards[state.sortIdx];const fb=document.getElementById('sfb');
  if(a===c.a){gain();fb.className='fb ok';fb.textContent='✅ 答對了！(+10)';setTimeout(()=>{state.sortIdx++;renderSort();},800);}
  else{lose(c.a==='nat'?'geology':'pollution');fb.className='fb no';fb.textContent=(c.a==='nat'?'❌ 這是大自然慢慢造成的，扣 5 分，再選一次！':'❌ 這是人類造成的破壞，扣 5 分，再選一次！');}
}
function lvl3(){
  state.cycleNext=0;let slots='',chips='';
  for(let i=0;i<cycleAnswer.length;i++)slots+=`<div class="slot" id="slot${i}">?</div>`+(i<cycleAnswer.length-1?'<span class="arrow">➡️</span>':'<span class="arrow">🔁</span>');
  cyclePool.forEach((c,i)=>{chips+=`<button class="chip" id="chip${i}" onclick="pickCycle(${i})">${c}</button>`;});
  show(`<span class="scene-tag">關卡 7 / 10 · 統整</span><h2>🔄 海與岩的循環</h2><p class="sub">原來野柳的岩石裡找得到海洋化石！<br>依正確順序點選卡片，排出「海 → 岩 → 海」的循環。</p><div class="cycle">${slots}</div><div class="pick">${chips}</div><div class="fb" id="cfb"></div>`);
}
function pickCycle(i){
  const want=cycleAnswer[state.cycleNext];const chip=document.getElementById('chip'+i);
  if(cyclePool[i]===want){
    const slot=document.getElementById('slot'+state.cycleNext);slot.textContent=want;slot.classList.add('filled');chip.disabled=true;state.cycleNext++;gain();
    const fb=document.getElementById('cfb');fb.className='fb ok';fb.textContent='✅ 順序正確！(+10)';
    if(state.cycleNext>=cycleAnswer.length)fb.innerHTML='🎉 完成循環！<br><span class="sub">原來海和陸、生命和岩石，是同一個地球在循環。</span><div class="center"><button class="btn blue" onclick="goto(7)">最後統整關 →</button></div>';
  }else{lose('geology');const fb=document.getElementById('cfb');fb.className='fb no';fb.textContent='❌ 順序不對，扣 5 分！';}
}
function lvl4(){
  const acts=["🛒 買東西自備購物袋、不買過度包裝","🥤 自備水壺，少用一次性塑膠","🗑️ 看到海邊垃圾主動撿起、做好分類","🐟 認識永續海鮮，吃對魚","📣 把今天學到的告訴家人朋友"];
  let list='';acts.forEach((a,i)=>{list+=`<label class="check"><input type="checkbox" onchange="updPledge()" id="act${i}"><span>${a}</span></label>`;});
  show(`<span class="scene-tag">關卡 8 / 10 · 統整</span><h2>🌱 我是改變的力量</h2><p class="sub">有些改變我們只能珍惜（女王頭終會風化）；<br>有些改變我們<b>可以阻止</b>（海洋污染與暖化）。<br>勾選你做得到的行動，寫下你的永續宣言！</p>${list}<textarea id="vow" placeholder="✍️ 寫下我的永續宣言：我承諾……" oninput="updPledge()"></textarea><div id="pledgeBox"></div><div class="center"><button class="btn" id="finishBtn" disabled onclick="goto(8)">繼續挑戰新關卡 🏅</button><div class="fb" id="vowHint" style="font-size:14px;color:#c0612e">✍️ 先勾一個行動、並寫下你的永續宣言，才能繼續喔！</div></div>`);
}
function updPledge(){
  let n=0;for(let i=0;i<5;i++){if(document.getElementById('act'+i)?.checked)n++;}
  const vow=document.getElementById('vow').value.trim();const box=document.getElementById('pledgeBox');
  if(n>0||vow)box.innerHTML=`<div class="pledge"><div class="star">⭐</div><h3>我的永續宣言卡</h3><div class="big">我選擇了 <b>${n}</b> 個護海行動${vow?'<br>「'+vow+'」':''}</div><div class="sub" style="color:#cdeefb">分辨能改變的，並為它行動 — 這就是永續！</div></div>`;
  else box.innerHTML='';
  const btn=document.getElementById('finishBtn');const hint=document.getElementById('vowHint');
  if(btn){const ok=(n>0&&vow.length>0);btn.disabled=!ok;if(hint)hint.classList.toggle('hide',ok);}
}
let flipSt={cards:[],timer:null,timeLeft:120,matched:0,flipped:[],locked:false};
function lvlFlipCard(){
  clearInterval(flipSt.timer);const allCards=[];
  flipPairs.forEach(p=>{allCards.push({pairId:p.id,type:'event',text:p.text,cat:p.cat,factoid:p.factoid});allCards.push({pairId:p.id,type:'match',text:p.match,cat:p.cat,factoid:p.factoid});});
  for(let i=allCards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[allCards[i],allCards[j]]=[allCards[j],allCards[i]];}
  flipSt={cards:allCards,timer:null,timeLeft:120,matched:0,flipped:[],locked:false};
  let grid='';allCards.forEach((_,i)=>{grid+=`<div class="fc" id="fc${i}" onclick="flipCard(${i})"><div class="fc-inner"><div class="fc-front">🌊</div><div class="fc-back" id="fcb${i}"></div></div></div>`;});
  show(`<span class="scene-tag">關卡 9 / 10 · 新挑戰</span><h2>🎴 海洋大事翻牌配對</h2><p class="sub">翻開卡片，找出每個<b>大事件</b>與對應的<b>描述</b>，時間 2 分鐘！</p><div class="flip-status"><span>已配對：<b id="matchedCount">0</b> / ${flipPairs.length}</span><span class="flip-timer" id="flipTimer">⏱ 2:00</span></div><div class="flip-grid">${grid}</div><div class="fb" id="flipFb"></div><div class="factoid" id="flipFactoid"></div>`);
  allCards.forEach((c,i)=>{const el=document.getElementById('fcb'+i);if(el)el.textContent=c.text;});
  flipSt.timer=setInterval(flipTick,1000);
}
function flipTick(){
  flipSt.timeLeft--;const el=document.getElementById('flipTimer');if(!el){clearInterval(flipSt.timer);return;}
  const m=Math.floor(flipSt.timeLeft/60),s=flipSt.timeLeft%60;el.textContent=`⏱ ${m}:${s<10?'0':''}${s}`;
  if(flipSt.timeLeft<=30)el.classList.add('warn');if(flipSt.timeLeft<=0){clearInterval(flipSt.timer);flipTimeUp();}
}
function flipTimeUp(){
  flipSt.cards.forEach((_,i)=>{const fc=document.getElementById('fc'+i);if(fc&&!fc.classList.contains('matched'))fc.classList.add('flipped');});
  const fb=document.getElementById('flipFb');if(fb){fb.className='fb no';fb.textContent='⏰ 時間到！沒關係，繼續下一關。';}
  setTimeout(()=>goto(9),2200);
}
function flipCard(i){
  if(flipSt.locked)return;const fc=document.getElementById('fc'+i);
  if(!fc||fc.classList.contains('matched')||fc.classList.contains('flipped'))return;
  fc.classList.add('flipped');flipSt.flipped.push(i);
  if(flipSt.flipped.length===2){
    flipSt.locked=true;const[a,b]=flipSt.flipped;const ca=flipSt.cards[a],cb=flipSt.cards[b];
    if(ca.pairId===cb.pairId&&ca.type!==cb.type){
      setTimeout(()=>{
        [document.getElementById('fc'+a),document.getElementById('fc'+b)].forEach(el=>el&&el.classList.add('matched'));
        flipSt.matched++;gain(ca.cat);document.getElementById('matchedCount').textContent=flipSt.matched;
        const fact=document.getElementById('flipFactoid');if(fact){fact.style.display='block';fact.textContent=ca.factoid;}
        flipSt.flipped=[];flipSt.locked=false;
        if(flipSt.matched>=flipPairs.length){clearInterval(flipSt.timer);const fb=document.getElementById('flipFb');if(fb){fb.className='fb ok';fb.innerHTML='🎉 全部配對完成！加分完畢，進入最後一關！';}setTimeout(()=>goto(9),1800);}
      },500);
    }else{
      setTimeout(()=>{
        [document.getElementById('fc'+a),document.getElementById('fc'+b)].forEach(el=>el&&el.classList.remove('flipped'));
        flipSt.flipped=[];flipSt.locked=false;lose(ca.cat);
        const fb=document.getElementById('flipFb');if(fb){fb.className='fb no';fb.textContent='❌ 不是一對，扣 5 分，再試試！';}
      },900);
    }
  }
}
let tlSel=null,tlPlaced=0,tlPool=[];
function lvlTimeline(){
  tlSel=null;tlPlaced=0;tlPool=[...timelineEvents].sort(()=>Math.random()-0.5);
  let poolHtml='',slotsHtml='';
  tlPool.forEach((e,i)=>{poolHtml+=`<div class="tl-card" id="tlc${i}" onclick="selectTlCard(${i})">${e.text}</div>`;});
  timelineEvents.forEach((e,si)=>{slotsHtml+=`<div class="tl-slot" id="tls${si}" onclick="placeInSlot(${si})">${e.year} 年</div>`;});
  show(`<span class="scene-tag">關卡 10 / 10 · 新挑戰</span><h2>📅 海洋大事時間軸</h2><p class="sub">先點選左邊的事件，再點右邊正確的年份欄位，把大事排到時間軸上！</p><div class="tl-wrap"><div class="tl-pool">${poolHtml}</div><div class="tl-slots">${slotsHtml}</div></div><div class="fb" id="tlFb"></div><div class="center hide" id="tlFinish"><button class="btn" onclick="finish()">完成闖關 🏅</button></div>`);
}
function selectTlCard(origIdx){
  if(document.getElementById('tlc'+origIdx)?.classList.contains('used'))return;
  tlSel=origIdx;document.querySelectorAll('.tl-card').forEach(c=>c.classList.remove('selected'));document.getElementById('tlc'+origIdx)?.classList.add('selected');
}
function placeInSlot(slotIdx){
  const fb=document.getElementById('tlFb');if(document.getElementById('tls'+slotIdx)?.classList.contains('filled'))return;
  if(tlSel===null){fb.className='fb no';fb.textContent='👈 先點左邊選一個事件！';return;}
  const card=tlPool[tlSel];const slot=timelineEvents[slotIdx];
  if(card.year===slot.year){
    const slotEl=document.getElementById('tls'+slotIdx);if(slotEl){slotEl.classList.add('filled');slotEl.textContent=card.text;}
    const cardEl=document.getElementById('tlc'+tlSel);if(cardEl){cardEl.classList.add('used');cardEl.classList.remove('selected');}
    tlPlaced++;tlSel=null;gain('conservation');fb.className='fb ok';fb.textContent='✅ 放對了！(+10)';
    if(tlPlaced>=timelineEvents.length){fb.innerHTML='🎉 時間軸排列完成！你對海洋大事掌握得很清楚！';document.getElementById('tlFinish').classList.remove('hide');}
  }else{
    const slotEl=document.getElementById('tls'+slotIdx);slotEl?.classList.add('wrong-slot');setTimeout(()=>slotEl?.classList.remove('wrong-slot'),400);
    lose('conservation');fb.className='fb no';fb.textContent='❌ 年份不對，扣 5 分，再試試！';
  }
}
function saveScore(){
  const entry={name:state.playerName,cls:state.playerClass,pts:state.points,correct:state.correct,wrong:state.wrong,ts:Date.now()};
  let all=[];try{all=JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){}
  all.push(entry);all.sort((a,b)=>b.pts-a.pts);if(all.length>50)all=all.slice(0,50);
  localStorage.setItem(LS_KEY,JSON.stringify(all));return all;
}
function renderLb(all){
  if(!all||!all.length)return'<p class="sub">尚無紀錄</p>';const top=all.slice(0,20);let rows='';
  top.forEach((e,i)=>{const isMe=(e.name===state.playerName&&e.cls===state.playerClass&&e.pts===state.points);rows+=`<tr class="${isMe?'me':''}"><td>${i+1}</td><td>${e.cls}</td><td>${e.name}</td><td>${e.pts}</td><td>✅${e.correct} ❌${e.wrong}</td></tr>`;});
  return`<table class="lb-table"><tr><th>名次</th><th>班級</th><th>姓名</th><th>分數</th><th>作答</th></tr>${rows}</table>`;
}
function clearLb(){if(confirm('確定要清除排行榜嗎？此動作無法還原。')){localStorage.removeItem(LS_KEY);document.getElementById('lbSection').innerHTML='<p class="sub">排行榜已清除。</p>';}}
function getTitle(pts){if(pts>=340)return'🏆 海洋守護大師';if(pts>=260)return'🥇 海洋守護高手';if(pts>=180)return'🥈 見習海洋守護者';if(pts>=100)return'🥉 海洋小勇士';return'🌱 努力中的海洋新手';}
function getAdvice(){
  const wc=state.wrongCats;const worst=Object.entries(wc).sort((a,b)=>b[1]-a[1])[0];
  if(!worst||worst[1]===0)return'你表現得非常棒！繼續守護我們的海洋！🌊';
  const m={pollution:'你在<b>海洋污染</b>相關題目需要加強！建議多了解塑膠垃圾與微塑膠的危害，從自備購物袋、水壺做起。',climate:'你在<b>氣候變遷與珊瑚</b>相關題目需要加強！建議了解暖化如何影響海洋，並思考日常節能減碳的方法。',conservation:'你在<b>海洋保育</b>相關題目需要加強！建議多了解公海條約、海洋保護區的意義，以及我們如何支持保育行動。',geology:'你在<b>海洋地質</b>相關題目需要加強！建議多認識火山、岩石風化和野柳地景的形成故事。'};
  return m[worst[0]]||'繼續加油！';
}
function finish(){
  state.points+=10;updateScore();renderProgress();
  document.querySelectorAll('#progress .dot').forEach(d=>d.classList.add('done'));
  const pts=state.points;const title=getTitle(pts);const advice=getAdvice();const all=saveScore();
  const myRank=all.findIndex(e=>e.name===state.playerName&&e.cls===state.playerClass&&e.pts===pts)+1;
  const emoji=title.split(' ')[0];const titleText=title.replace(/^[^\s]+\s/,'');
  stage().innerHTML=`<div class="card final" style="color:var(--ink)"><div class="badge">${emoji}</div><h2 style="color:var(--mid)">${titleText}</h2><div class="scorecard"><div class="bignum">${pts}<span> 分</span></div><div class="qa">✅ 答對 ${state.correct} 題　｜　❌ 答錯 ${state.wrong} 題</div><div class="note2">全班排名第 ${myRank} 名 🎉</div></div><div class="advice-box"><b>🌊 給你的護海建議：</b><br>${advice}</div><p class="sub" style="margin-top:14px">你學會了 ——<br>🪨 大自然的改變：慢、不可逆，我們珍惜<br>🐠 人類的改變：快、可逆，我們<b>能行動</b><br>🔄 海與岩是同一個地球的循環<br>🌱 永續，就是分辨清楚並付出行動</p><h3 style="color:var(--mid);margin:16px 0 4px">🏅 全班排行榜（前 20 名）</h3><div id="lbSection">${renderLb(all)}</div><div class="center" style="margin-top:8px"><button class="btn ghost" style="font-size:13px" onclick="clearLb()">🗑️ 清除排行榜</button></div><div class="center" style="margin-top:14px"><button class="btn" onclick="window.print()">🖨️ 列印 / 存成 PDF</button><button class="btn ghost" onclick="resetGame()">🔁 再玩一次</button></div></div>`;
}
const stages=[lvlReadQuiz,lvlOceanTower,lvlCoral,lvlRockTower,lvlLandform,lvl2,lvl3,lvl4,lvlFlipCard,lvlTimeline];
function goto(step){if(step===-1){resetGame();return;}state.step=step;renderProgress();stages[step]();window.scrollTo({top:0,behavior:'smooth'});}
function resetGame(){clearInterval(flipSt&&flipSt.timer);state={playerName:'',playerClass:'',step:0,points:0,correct:0,wrong:0,sortIdx:0,cycleNext:0,readQuizDone:new Set(),wrongCats:{pollution:0,climate:0,conservation:0,geology:0}};loginScreen();window.scrollTo({top:0,behavior:'smooth'});}
function makeBubbles(){for(let i=0;i<14;i++){const b=document.createElement('div');b.className='bubble';const s=6+Math.random()*22;b.style.width=s+'px';b.style.height=s+'px';b.style.left=Math.random()*100+'vw';b.style.animationDuration=(8+Math.random()*10)+'s';b.style.animationDelay=(Math.random()*8)+'s';document.body.appendChild(b);}}
makeBubbles();loginScreen();
</script>
